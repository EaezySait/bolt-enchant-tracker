name: Suggest a feature
description: Share an idea to make BoltWise more useful.
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        We'd love to hear your ideas! Suggestions are public, so please leave out personal information.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      placeholder: Describe your idea for BoltWise.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would this help? (optional)
      placeholder: Tell us how you would use it during your enchanting sessions.
  - type: textarea
    id: examples
    attributes:
      label: Examples or screenshots (optional)
      description: Add any details or pictures that help explain your idea.
